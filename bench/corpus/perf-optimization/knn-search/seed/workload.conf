# Canonical benchmark workload for the knn-search task.
#
# READ-ONLY. Sourced by build.sh, run.sh and test.sh, and parsed by
# tools/bench.py and tools/verify_correctness.py. Every published number for
# this task is measured on exactly this workload; changing a value here
# invalidates the baseline and fails the checksum guard.

# Where the generated benchmark workload lives (gitignored).
WORKLOAD_DIR=data/generated

# Workload shape.
N=400000
D=32
QUERIES=1024
K=10
SEED=20260820

# Pass/fail thresholds enforced by tools/bench.py --check-target.
TARGET_SPEEDUP=40
MAX_PEAK_RSS_MB=2048

# Benchmark protocol.
BENCH_WARMUP=1
BENCH_REPS=5
